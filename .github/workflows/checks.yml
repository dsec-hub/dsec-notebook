name: Checks

on:
    pull_request:
    push:
        branches-ignore: [main]

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Format check
              run: npm run fmt:check

            - name: Lint
              run: npm run lint

            - name: Svelte check
              run: npm run check
