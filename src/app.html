<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="A resource hub for Deakin University students. Shared study notes, questions and answers for SIT and Mathematics units."
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Notebook" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="theme-color" content="#ffffff" />
		<script>
			(function () {
				var stored = localStorage.getItem("dsec_theme");
				var dark =
					stored === "dark" ||
					(!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
				var root = document.documentElement;
				root.classList.toggle("dark", dark);
				root.style.colorScheme = dark ? "dark" : "light";
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute("content", dark ? "#131014" : "#ffffff");
			})();
		</script>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon2.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
